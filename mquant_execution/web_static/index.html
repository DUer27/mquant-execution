<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>M-quant Paper Execution</title><style>body{font:15px system-ui,sans-serif;max-width:1100px;margin:2rem auto;padding:0 1rem;color:#17202a}header{display:flex;justify-content:space-between;align-items:center}section{border:1px solid #ddd;border-radius:8px;padding:1rem;margin:1rem 0}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #eee;padding:.45rem;text-align:left}code{background:#f2f2f2;padding:.15rem .3rem}</style></head>
<body><header><h1>Paper Execution</h1><span id="health">loading…</span></header><p>只读监控页面；系统固定为 <code>PAPER</code>，网页不提供下单按钮。</p><label>账户 <input id="account" value="paper"><button onclick="load()">刷新</button></label><section><h2>账户总览</h2><pre id="summary">loading…</pre></section><section><h2>持仓</h2><table id="positions"><thead><tr><th>标的</th><th>数量</th><th>可卖</th><th>成本</th><th>最新价</th></tr></thead><tbody></tbody></table></section><section><h2>订单</h2><table id="orders"><thead><tr><th>订单</th><th>方向</th><th>标的</th><th>数量</th><th>状态</th><th>原因</th></tr></thead><tbody></tbody></table></section><script>
const esc=x=>String(x??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); async function load(){const a=encodeURIComponent(document.querySelector('#account').value);const r=await fetch('/api/v1/accounts/'+a+'/dashboard');if(!r.ok){summary.textContent='账户不存在';return}const d=await r.json();summary.textContent=JSON.stringify({available_cash:d.available_cash,withdrawable_cash:d.withdrawable_cash,pending_cash:d.pending_cash,total_assets:d.total_assets},null,2);positions.querySelector('tbody').innerHTML=(d.positions||[]).map(p=>`<tr><td>${esc(p.symbol)}</td><td>${esc(p.quantity)}</td><td>${esc(p.available_quantity)}</td><td>${esc(p.average_price)}</td><td>${esc(p.price)}</td></tr>`).join('');orders.querySelector('tbody').innerHTML=(d.orders||[]).map(o=>`<tr><td>${esc(o.order_id)}</td><td>${esc(o.side)}</td><td>${esc(o.symbol)}</td><td>${esc(o.quantity)}</td><td>${esc(o.status)}</td><td>${esc(o.reason)}</td></tr>`).join('')}fetch('/api/v1/health').then(r=>r.json()).then(x=>health.textContent=x.mode);load();
</script></body></html>
